# CI 镜像构建工作流（ADR-0013）
# 触发：
#   - push tag v*  → 跑测试 → 构建并推送镜像到 GitLab Container Registry（tag + latest）
#   - push main    → 跑测试 → 仅构建验证（不推送）
#   - MR           → 仅跑测试
# 依赖：Runner 需支持 docker dind（privileged）或提供 DOCKER_HOST socket 绑定。
stages:
  - test
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"

test-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  script:
    - mvn -B test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == "main"'

test-frontend:
  stage: test
  image: node:20
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run test:run
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == "main"'

verify-platform-tools:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build
      --platform linux/amd64
      -f docker/Dockerfile.platform-tools
      -t platform-tools:ci
      .
    - docker run --rm --entrypoint /usr/bin/python3 platform-tools:ci --version
    - docker run --rm platform-tools:ci
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == "main"'

# 票 08：冒烟 E2E（不需要牺牲主机的那一组）
# 分两步：先在 maven 镜像里出 fat jar 当 artifact，再用 node 镜像跑 Playwright，
# 避免同一个 job 里同时装 JDK 与 Node。脚本与 GitHub Actions 共用 scripts/e2e-ci.sh。
e2e-jar:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  script:
    - mvn -B -q -pl core -am package -DskipTests
  artifacts:
    expire_in: 1 day
    paths:
      - backend/core/target/*-exec.jar
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == "main"'

e2e-smoke:
  stage: test
  image: node:20-bookworm
  needs: ["e2e-jar"]
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  before_script:
    # 只跑 fat jar，不需要完整 JDK
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends default-jre-headless curl >/dev/null
    - cd frontend && npm ci && npx playwright install --with-deps chromium && cd ..
  script:
    - bash scripts/e2e-ci.sh --group smoke
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - frontend/e2e/.report/
      - frontend/e2e/.last-run/
      - frontend/e2e/.artifacts/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == "main"'

.build-template: &build-template
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  rules:
    # 仅 tag 推送；main 分支构建验证由 build-verify 承担
    - if: '$CI_COMMIT_TAG =~ /^v/'

build-backend:
  <<: *build-template
  script:
    - docker build
      --platform linux/amd64
      -f docker/Dockerfile.backend
      -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_TAG"
      -t "$CI_REGISTRY_IMAGE/backend:latest"
      .
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"

build-frontend:
  <<: *build-template
  script:
    - docker build
      --platform linux/amd64
      -f docker/Dockerfile.frontend
      -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_TAG"
      -t "$CI_REGISTRY_IMAGE/frontend:latest"
      .
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"

# main 分支 push：测试通过后仅构建验证，不推送
build-verify:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build --platform linux/amd64 -f docker/Dockerfile.backend .
    - docker build --platform linux/amd64 -f docker/Dockerfile.frontend .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
