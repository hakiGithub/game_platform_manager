# 前端 nginx：静态托管 dist + 反代后端
# 与 frontend/vite.config.js 的代理规则保持一致：
#   /api  -> http://backend:8080（原样透传，后端 context-path 即 /api）
#   /ws   -> http://backend:8080/api/ws（WebSocket）
server {
    listen 80;
    server_name _;

    client_max_body_size 500m;

    # 前端静态资源（SPA 路由回退 index.html）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # REST API（含 /api/pf4j/plugin/*/ui 插件前端资源）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级（/api/ws/** 终端、日志流）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSH 终端 / 日志流为长连接，放宽超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket 简写路径：/ws/** -> /api/ws/**
    location /ws/ {
        rewrite ^/ws/(.*)$ /api/ws/$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
