# MySQL 数据库部署（预留，后端暂不支持 MySQL —— 见 ADR-0012）
# 本文件提供真实可启动的 MySQL 8.4 服务，可作为独立开发库使用。
# 后端接入前置改造清单（见 docker/README.md）：
#   1. backend/pom.xml 增加 com.mysql:mysql-connector-j
#   2. db/schema.sql / data.sql 提供 MySQL 方言版本
#   3. DatabaseInitializer 按方言路由初始化脚本
# 完成后，在 base compose 之上叠加：
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: game_platform_root
      MYSQL_DATABASE: game_platform
      MYSQL_USER: game_platform
      MYSQL_PASSWORD: game_platform_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugame_platform", "-pgame_platform_123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 待后端支持 MySQL 后启用（替换 base 中的 backend 环境变量）----
  # backend:
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/game_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  #     SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
  #     SPRING_DATASOURCE_USERNAME: game_platform
  #     SPRING_DATASOURCE_PASSWORD: game_platform_123

volumes:
  mysql_data:
