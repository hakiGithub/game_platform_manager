# PostgreSQL 数据库部署（预留，后端暂不支持 PostgreSQL —— 见 ADR-0012）
# 本文件提供真实可启动的 PostgreSQL 16 服务，可作为独立开发库使用。
# 后端接入前置改造清单（见 docker/README.md）：
#   1. backend/pom.xml 增加 org.postgresql:postgresql
#   2. db/schema.sql / data.sql 提供 PostgreSQL 方言版本
#   3. DatabaseInitializer 按方言路由初始化脚本
# 完成后，在 base compose 之上叠加：
#   docker compose -f docker-compose.yml -f docker-compose.pg.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: game_platform
      POSTGRES_USER: game_platform
      POSTGRES_PASSWORD: game_platform_123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_platform -d game_platform"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- 待后端支持 PostgreSQL 后启用（替换 base 中的 backend 环境变量）----
  # backend:
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/game_platform
  #     SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  #     SPRING_DATASOURCE_USERNAME: game_platform
  #     SPRING_DATASOURCE_PASSWORD: game_platform_123

volumes:
  pg_data:
