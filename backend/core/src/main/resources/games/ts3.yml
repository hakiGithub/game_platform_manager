game:
  code: ts3
  name: Teamspeak 3
  description: Teamspeak 3 游戏服务端（基于 LinuxGSM Docker 部署）
  version: "latest"
  icon: /icons/ts3.jpg

  # 支持的部署方式
  deployTypes:
    - linuxgsm-docker

  # 默认端口
  defaultPorts:
    voice: 9987
    query: 10011
    file: 30033

  # LinuxGSM Docker部署配置
  # 基于 gameservermanagers/gameserver:ts3 镜像
  # 参考: https://github.com/GameServerManagers/docker-gameserver
  # 特点: 容器内置 LinuxGSM 和 ts3server 脚本，以 linuxgsm 用户运行，数据持久化在 /data
  linuxgsmDocker:
    shortname: ts3server
    imageRepo: gameservermanagers/gameserver
    imageTag: ts3
    composeTemplate: |
      services:
        ts3server:
          image: ${IMAGE_REPO:-gameservermanagers/gameserver}:${IMAGE_TAG:-ts3}
          container_name: ${CONTAINER_NAME:-ts3server-lgsm}
          network_mode: host
          restart: unless-stopped
          volumes:
            - ${DATA_VOLUME:-ts3-lgsm-data}:/data
            - /etc/localtime:/etc/localtime:ro
          environment:
            - LGSM_GAMESERVERNAME=ts3server

    variables:
      - name: CONTAINER_NAME
        label: 容器名称
        type: string
        defaultValue: "ts3server-lgsm"
        required: false
        description: Docker 容器名称
        hidden: true
      - name: IMAGE_REPO
        label: 镜像仓库
        type: string
        defaultValue: "gameservermanagers/gameserver"
        required: false
        description: LinuxGSM Docker 镜像仓库
        hidden: true
      - name: IMAGE_TAG
        label: 镜像标签
        type: string
        defaultValue: "ts3"
        required: false
        description: 镜像标签（即 LinuxGSM 游戏服务器简称）
        hidden: true
      - name: DATA_VOLUME
        label: 数据卷名
        type: string
        defaultValue: "ts3-lgsm-data"
        required: false
        description: 数据持久化卷名（挂载到容器 /data）
        hidden: true

    namedVolumes:
      - ts3-lgsm-data
