game:
  code: rust
  name: Rust
  description: Rust是一款多人生存游戏，玩家需要在荒野中收集资源、建造基地并生存下去
  version: "latest"
  icon: /icons/rust.jpg

  # 支持的部署方式
  deployTypes:
    - docker
    - linuxgsm
    - linuxgsm-docker

  # 默认端口
  defaultPorts:
    game: 28015
    query: 28016
    rcon: 28017
    app: 28018

  # 环境依赖
  dependencies:
    memory: "8G"
    disk: "10G"
    cpu: "4核"
    steamcmd: "required"

  # Docker部署配置
  docker:
    image: didstopia/rust-server
    tag: latest
    env:
      RUST_SERVER_STARTUP_ARGUMENTS: "-batchmode -load +server.secure true"
      RUST_SERVER_IDENTITY: "rust-server"
      RUST_SERVER_SEED: "12345"
      RUST_SERVER_NAME: "Rust Server"
      RUST_SERVER_DESCRIPTION: "Welcome to Rust Server"
      RUST_SERVER_URL: ""
      RUST_SERVER_BANNER_URL: ""
      RUST_RCON_WEB: "true"
      RUST_RCON_PORT: "28016"
      RUST_RCON_PASSWORD: "rconpassword"
      RUST_SERVER_MAXPLAYERS: "50"
      RUST_SERVER_WORLDSIZE: "3500"
      RUST_SERVER_SAVE_INTERVAL: "600"
      RUST_SERVER_OXIDE_ENABLED: "true"
      RUST_SERVER_OXIDE_UPDATE_ON_BOOT: "true"
      RUST_SERVER_AUTO_UPDATE: "1"
      RUST_SERVER_AUTO_UPDATE_CHECK_INTERVAL: "300"
    volumes:
      - /steamcmd/rust
      - /steamcmd/rust/oxide
    ports:
      - "28015:28015/udp"
      - "28016:28016/tcp"
      - "28017:28017/tcp"
    restartPolicy: unless-stopped
    resources:
      memory: "10G"
      cpu: "4"
    healthCheck:
      enabled: true
      test: "pgrep RustDedicated"
      interval: 60
      timeout: 10
      retries: 3
      startPeriod: 300

  # LinuxGSM部署配置
  linuxgsm:
    script: rustserver
    gameCode: rust
    configFile: server.cfg
    installDir: /home/rustserver
    startParams: "+server.secure true +server.headerimage '' +server.url ''"
    ports:
      - "28015/udp"
      - "28016/tcp"
      - "28017/tcp"

  # LinuxGSM Docker部署配置
  # 基于 gameservermanagers/gameserver:rustserver 镜像
  # 参考: https://github.com/GameServerManagers/docker-gameserver
  # 特点: 容器内置 LinuxGSM 和 rustserver 脚本，以 linuxgsm 用户运行，数据持久化在 /data
  linuxgsmDocker:
    shortname: rustserver
    imageRepo: gameservermanagers/gameserver
    imageTag: rust
    composeTemplate: |
      services:
        rustserver:
          image: ${IMAGE_REPO:-gameservermanagers/gameserver}:${IMAGE_TAG:-rust}
          container_name: ${CONTAINER_NAME:-rustserver-lgsm}
          network_mode: host
          restart: unless-stopped
          volumes:
            - ${DATA_VOLUME:-rust-lgsm-data}:/data
            - /etc/localtime:/etc/localtime:ro
          environment:
            - LGSM_GAMESERVERNAME=rustserver

    variables:
      - name: CONTAINER_NAME
        label: 容器名称
        type: string
        defaultValue: "rustserver-lgsm"
        required: false
        description: Docker 容器名称
        hidden: true
      - name: IMAGE_REPO
        label: 镜像仓库
        type: string
        defaultValue: "gameservermanagers/gameserver"
        required: false
        description: LinuxGSM Docker 镜像仓库
        hidden: true
      - name: IMAGE_TAG
        label: 镜像标签
        type: string
        defaultValue: "rust"
        required: false
        description: 镜像标签（即 LinuxGSM 游戏服务器简称）
        hidden: true
      - name: DATA_VOLUME
        label: 数据卷名
        type: string
        defaultValue: "rust-lgsm-data"
        required: false
        description: 数据持久化卷名（挂载到容器 /data）
        hidden: true

    namedVolumes:
      - rust-lgsm-data

  # 配置Schema
  configSchema:
    properties:
      serverName:
        type: string
        default: "Rust Server"
        maxLength: 100
        label: 服务器名称
        component: input
      serverDescription:
        type: string
        default: "Welcome to Rust Server"
        maxLength: 500
        label: 服务器描述
        component: textarea
      serverIdentity:
        type: string
        default: "rust-server"
        maxLength: 50
        label: 服务器标识
        description: 用于存档和配置的文件夹名称
        component: input
      maxPlayers:
        type: integer
        default: 50
        minimum: 1
        maximum: 500
        label: 最大玩家数
        component: number
      worldSize:
        type: integer
        default: 3500
        enum:
          - 1000
          - 2000
          - 3000
          - 3500
          - 4000
          - 5000
          - 6000
        label: 地图大小
        description: 地图大小（米），越大需要越多的内存和CPU
        component: select
      serverSeed:
        type: integer
        default: 12345
        minimum: 0
        maximum: 2147483647
        label: 地图种子
        description: 用于生成地图的随机种子
        component: number
      serverPassword:
        type: string
        default: ""
        label: 服务器密码
        description: 设置后需要密码才能进入
        component: password
      rconPassword:
        type: string
        default: ""
        label: RCON密码
        description: 远程管理密码，建议设置强密码
        component: password
      saveInterval:
        type: integer
        default: 600
        minimum: 60
        maximum: 3600
        label: 自动保存间隔(秒)
        component: number
      decayScale:
        type: number
        default: 1.0
        minimum: 0.0
        maximum: 2.0
        label: 建筑腐蚀速度
        description: 0表示关闭腐蚀，1为正常速度
        component: number
      gatherRate:
        type: number
        default: 1.0
        minimum: 0.1
        maximum: 10.0
        label: 资源采集倍率
        component: number
      craftRate:
        type: number
        default: 1.0
        minimum: 0.1
        maximum: 10.0
        label: 制作速度倍率
        component: number
      smeltRate:
        type: number
        default: 1.0
        minimum: 0.1
        maximum: 10.0
        label: 熔炼速度倍率
        component: number
      nightTime:
        type: number
        default: 0.5
        minimum: 0.0
        maximum: 1.0
        label: 夜晚时间比例
        description: 夜晚占一天的比例
        component: number
      pveMode:
        type: boolean
        default: false
        label: PVE模式
        description: 关闭玩家之间的伤害
        component: switch
      oxideEnabled:
        type: boolean
        default: true
        label: 启用Oxide插件
        description: 启用Oxide/uMod插件框架
        component: switch
      autoUpdate:
        type: boolean
        default: true
        label: 自动更新
        description: 自动检查并安装服务器更新
        component: switch
    required:
      - serverName
      - serverIdentity
      - maxPlayers
      - worldSize

    layout:
      columns: 2
      groups:
        - title: 基础设置
          fields:
            - serverName
            - serverDescription
            - serverIdentity
            - maxPlayers
            - serverPassword
            - rconPassword
        - title: 地图设置
          fields:
            - worldSize
            - serverSeed
        - title: 游戏倍率
          fields:
            - gatherRate
            - craftRate
            - smeltRate
            - decayScale
        - title: 时间与模式
          fields:
            - nightTime
            - pveMode
            - saveInterval
        - title: 高级选项
          fields:
            - oxideEnabled
            - autoUpdate

  # 自定义操作
  customOperations:
    - name: 备份存档
      command: backup
      description: 备份服务器存档和配置
      icon: Download
      type: backup
      confirm: true
      async: true
      timeout: 300

    - name: 更新服务器
      command: update
      description: 更新Rust服务器到最新版本
      icon: RefreshCw
      type: maintenance
      confirm: true
      confirmMessage: 更新过程中服务器将重启，确定要继续吗？
      async: true
      timeout: 600

    - name: 更新Oxide
      command: update-oxide
      description: 更新Oxide/uMod插件框架
      icon: Puzzle
      type: maintenance
      confirm: true
      async: true
      timeout: 120

    - name: 清理实体
      command: entcount
      description: 查看当前实体数量
      icon: Activity
      type: management

    - name: 清理垃圾
      command: garbage
      description: 清理服务器内存垃圾
      icon: Trash2
      type: maintenance

    - name: 重启服务器
      command: restart
      description: 安全重启服务器
      icon: RefreshCw
      type: management
      confirm: true
      confirmMessage: 确定要重启服务器吗？所有玩家将被断开连接。
      async: true
      timeout: 180

    - name: 执行RCON命令
      command: rcon
      description: 执行自定义RCON命令
      icon: Terminal
      type: management
      paramsSchema:
        command:
          type: string
          required: true
          label: RCON命令
          placeholder: 例如：say Hello World
