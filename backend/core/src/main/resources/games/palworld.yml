game:
  code: palworld
  name: 幻兽帕鲁
  description: 幻兽帕鲁(Palworld)是一款支持多人联机的开放世界生存游戏
  version: "0.1.5.0"
  icon: /icons/pw.jpg

  # 支持的部署方式
  deployTypes:
    - docker
    - linuxgsm
    - linuxgsm-docker

  # 默认端口
  defaultPorts:
    game: 8211
    query: 27015

  # 环境依赖
  dependencies:
    memory: "8G"
    disk: "10G"
    cpu: "4核"

  # Docker部署配置
  docker:
    image: thijsvanloef/palworld-server-docker
    tag: latest
    env:
      PUID: "1000"
      PGID: "1000"
      PORT: "8211"
      PLAYERS: "32"
      SERVER_PASSWORD: ""
      MULTITHREADING: "true"
      COMMUNITY: "false"
      SERVER_NAME: "Palworld Server"
      ADMIN_PASSWORD: "admin123"
      UPDATE_ON_BOOT: "true"
      BACKUP_ENABLED: "true"
      BACKUP_CRON_EXPRESSION: "0 0 * * *"
    volumes:
      - /palworld
    ports:
      - "8211:8211/udp"
      - "27015:27015/udp"
    restartPolicy: unless-stopped
    resources:
      memory: "10G"
    healthCheck:
      enabled: true
      test: "pgrep PalServer-Linux"
      interval: 30
      timeout: 10
      retries: 3
      startPeriod: 120

  # LinuxGSM部署配置
  linuxgsm:
    script: pwserver
    gameCode: pw
    configFile: PalWorldSettings.ini
    installDir: /home/pwserver
    startParams: "-useperfthreads -NoAsyncLoadingThread -UseMultithreadForDS"
    ports:
      - "8211/udp"
      - "27015/udp"

  # LinuxGSM Docker部署配置
  # 基于 gameservermanagers/gameserver:pwserver 镜像
  # 参考: https://github.com/GameServerManagers/docker-gameserver
  # 特点: 容器内置 LinuxGSM 和 pwserver 脚本，以 linuxgsm 用户运行，数据持久化在 /data
  linuxgsmDocker:
    shortname: pwserver
    imageRepo: gameservermanagers/gameserver
    imageTag: pw
    composeTemplate: |
      services:
        pwserver:
          image: ${IMAGE_REPO:-gameservermanagers/gameserver}:${IMAGE_TAG:-pw}
          container_name: ${CONTAINER_NAME:-pwserver-lgsm}
          network_mode: host
          restart: unless-stopped
          volumes:
            - ${DATA_VOLUME:-pw-lgsm-data}:/data
            - /etc/localtime:/etc/localtime:ro
          environment:
            - LGSM_GAMESERVERNAME=pwserver

    variables:
      - name: CONTAINER_NAME
        label: 容器名称
        type: string
        defaultValue: "pwserver-lgsm"
        required: false
        description: Docker 容器名称
        hidden: true
      - name: IMAGE_REPO
        label: 镜像仓库
        type: string
        defaultValue: "gameservermanagers/gameserver"
        required: false
        description: LinuxGSM Docker 镜像仓库
        hidden: true
      - name: IMAGE_TAG
        label: 镜像标签
        type: string
        defaultValue: "pw"
        required: false
        description: 镜像标签（即 LinuxGSM 游戏服务器简称）
        hidden: true
      - name: DATA_VOLUME
        label: 数据卷名
        type: string
        defaultValue: "pw-lgsm-data"
        required: false
        description: 数据持久化卷名（挂载到容器 /data）
        hidden: true

    namedVolumes:
      - pw-lgsm-data

  # 配置Schema
  configSchema:
    properties:
      serverName:
        type: string
        default: "Palworld Server"
        maxLength: 50
        label: 服务器名称
        component: input
      maxPlayers:
        type: integer
        default: 32
        minimum: 1
        maximum: 32
        label: 最大玩家数
        component: number
      serverPassword:
        type: string
        default: ""
        label: 服务器密码
        description: 设置后玩家需要输入密码才能加入
        component: password
      adminPassword:
        type: string
        default: "admin123"
        label: 管理员密码
        component: password
      dayTimeSpeedRate:
        type: number
        default: 1.0
        minimum: 0.1
        maximum: 5.0
        label: 白天时间流速
        component: number
      nightTimeSpeedRate:
        type: number
        default: 1.0
        minimum: 0.1
        maximum: 5.0
        label: 夜晚时间流速
        component: number
      expRate:
        type: number
        default: 1.0
        minimum: 0.1
        maximum: 20.0
        label: 经验倍率
        component: number
      palCaptureRate:
        type: number
        default: 1.0
        minimum: 0.5
        maximum: 10.0
        label: 帕鲁捕获率
        component: number
      palSpawnNumRate:
        type: number
        default: 1.0
        minimum: 0.5
        maximum: 3.0
        label: 帕鲁生成数量倍率
        component: number
      deathPenalty:
        type: string
        enum:
          - None
          - Item
          - ItemAndEquipment
          - All
        default: Item
        label: 死亡惩罚
        component: select
      enablePlayerToPlayerDamage:
        type: boolean
        default: false
        label: 允许玩家互相伤害
        component: switch
      enableFriendlyFire:
        type: boolean
        default: false
        label: 允许友方伤害
        component: switch
    required:
      - serverName
      - maxPlayers

    layout:
      columns: 2
      groups:
        - title: 基础设置
          fields:
            - serverName
            - maxPlayers
            - serverPassword
            - adminPassword
        - title: 游戏倍率
          fields:
            - dayTimeSpeedRate
            - nightTimeSpeedRate
            - expRate
            - palCaptureRate
            - palSpawnNumRate
        - title: 游戏规则
          fields:
            - deathPenalty
            - enablePlayerToPlayerDamage
            - enableFriendlyFire

  # 自定义操作
  customOperations:
    - name: 备份存档
      command: backup
      description: 备份游戏存档
      icon: Download
      type: backup
      confirm: true
      async: true
      timeout: 300

    - name: 更新服务器
      command: update
      description: 更新服务器到最新版本
      icon: RefreshCw
      type: maintenance
      confirm: true
      confirmMessage: 更新过程中服务器将重启，确定要继续吗？
      async: true
      timeout: 600

    - name: 广播消息
      command: broadcast
      description: 向所有在线玩家发送消息
      icon: MessageSquare
      type: management
      paramsSchema:
        message:
          type: string
          required: true
          label: 消息内容

    - name: 保存世界
      command: save
      description: 立即保存游戏世界
      icon: Save
      type: management
