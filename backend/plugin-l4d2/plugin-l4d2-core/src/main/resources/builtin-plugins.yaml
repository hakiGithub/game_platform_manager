# L4D2 内置插件清单
#
# 来源：l4d2-server-next-master/plugins 目录，共 62 个插件包。
# 分类对齐源仓库目录前缀：必选 / 可选 / 自选，外加平台插件（SourceMod+Metamod 框架）。
#
# 字段说明：
#   id        - 插件 ID，与 plugins_store/<id> 目录名一致（也是 ZIP 文件名去掉 .zip）
#   name      - 展示名（前端列表用）
#   category  - 分类：platform | required | optional | custom
#   fileName  - builtin-plugins/ 目录下 ZIP 文件名
#   size      - ZIP 文件大小（字节）
#   platform  - 适用平台：linux | windows | all
#   description - 描述
#
# 安装策略：
#   1. 平台插件（platform）：Docker 部署使用 linux 版，Windows Native 使用 windows 版
#   2. 必选插件（required）：基础功能依赖，建议全部安装
#   3. 可选插件（optional）：修复类，按需安装
#   4. 自选插件（custom）：玩法增强，自由选择
#
# 安装流程：从 classpath 读取 ZIP → 调用 PluginInstallService.installFromLocalFile
#          → 解压到 plugins_store/<id>/left4dead2/... → 用户启用或应用预设使其生效

