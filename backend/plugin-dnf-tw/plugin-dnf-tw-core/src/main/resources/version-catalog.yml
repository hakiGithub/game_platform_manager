# =============================================================================
# dnf-tw 版本目录 —— 占位模板，不可上线
#
# 依据：OP-02 裁决（PRD §13.2 决策 2）、PRD §8.6、FR-23、BR-15 ①、N-12、AC-24 ⑤⑥。
#
# 本文件是「占位模板」：字段结构按 PRD §8.1 / §8.2 / §8.3 完整列出，但**不含任何可部署的
# 版本条目**——每个待填字段的值都是未填充标记 UNFILLED。读取时按「条目内仍有未填充标记
# ⇒ 该条整条不对外声明」过滤（标记写法与模板载体归技术设计，见 design.md §7.3 B-15），
# 所以 dnf-tw 的版本目录读取结果恒为**空目录（0 条目）**。
#
# 空目录命中 PRD §8.4.2 的 S1，可观察结果即 AC-24 的判据：
#   部署向导不出现「目标版本」选择项 · 提交载荷不存在 deployVersion 键 ·
#   不进入扩展阶段 · 部署结果与改造前逐项一致 · 不产生任何「不合法」提示行（EMPTY ≠ INVALID）。
#
# -----------------------------------------------------------------------------
# 真实资料到位后怎么填（FR-23 / BR-15 ④「填充即生效」）
#
#   1. 复制下面的条目块，把该条目里需要表达的字段值换成人类 Owner 提供的真实资料；
#   2. 不需要表达的可选字段**整行删掉**（留着 UNFILLED 等于没填完 ⇒ 该条不生效）；
#   3. **字符串字段一律加引号**（versionId / displayName / imageTag 与步骤里的 label / url /
#      targetPath / sha256 / includePattern / format / content）。不加引号时 YAML 1.1 会按标量
#      类型解析：点分数字被读成小数（尾零丢失）、前导零被按八进制解读、yes/no/on/off 被读成布尔、
#      冒号分隔的数字被读成六十进制整数 —— 平台侧一律拒绝这类取值而不是隐式转写，
#      因为 versionId 同时是部署载荷的键与镜像 tag 的组成部分，差一个字符就是另一个版本；
#   4. 只改本文件：不改任何 Java 代码、不改主应用 backend/core、不改 SDK 声明接口、
#      不动数据库、不在 games/dnf_tw.yml 加分支（BR-01 / G-01 / N-01）；
#   5. 重新构建插件 JAR 并热部署（§9.1 上线顺序 ② 的 --jar + env 覆盖路线）即生效。
#
# 其它会被平台拒绝（而非静默采纳）的写法：同一个键写两遍（后写覆盖已关闭）、
# 未定义的字段名、布尔位写成别词、position 落在 host/container 之外。
# 想让目录读为空请把 versions 整段留空或写成空列表 —— 与空文件同形，都是 EMPTY 不是 INVALID。
# 未填充标记的比对忽略大小写，unfilled 的小写手误同样使该条不生效。
#
# 「未填完即不生效」是刻意选择的形状：宁可目录读为空（向导不出现版本项），也不会把
# 半截条目当成可部署版本暴露给用户（PRD §13.2 决策 2；N-12 禁止假资料冒充）。
#
# 禁止：在本文件写入示例版号 / 示例补丁 URL / 示例目标路径（BR-15 ①、N-12、AC-24 ⑥）。
#
# 校验由主应用的版本目录唯一读者执行（design.md §16.3）：条目内任一项不合规 ⇒ **整目录**
# 判「声明不合法」（禁止部分采纳），所以填充时不要留下空必填项。
# =============================================================================

versions:
  # ---- 条目骨架（未填充）：复制本块以增加条目，一条目 = 一个可部署版本 ----
  - versionId: UNFILLED       # §8.1 必填 · 非空 · 同一游戏内唯一 · 仅 [A-Za-z0-9._-]
    displayName: UNFILLED     # §8.1 可选 · 缺省取 versionId
    imageTag: UNFILLED        # §8.1 可选 · 缺省沿用该部署方式 compose 模板既有 tag（dnf-tw 本期不用）
    default: UNFILLED         # §8.1 可选 · 缺省 false · 同一目录至多一条 true · 默认条目不执行扩展步骤

    patches:                  # §8.2 可选 · 补丁步骤集，按声明序执行（本期只支持远端 URL，不含鉴权头）
      - label: UNFILLED       # §8.2 可选 · 日志展示名，缺省为「序号 + PATCH」
        url: UNFILLED         # §8.2 必填 · 合法 http(s) URL · 补丁包来源
        targetPath: UNFILLED  # §8.2 必填 · 实例目录内的相对路径（BR-05：绝对路径或 .. 越界即声明不合法）
        sha256: UNFILLED      # §8.2 可选 · 64 位十六进制 · 缺省不做完整性校验
        includePattern: UNFILLED  # §8.2 可选 · 逗号分隔 glob · 仅压缩包生效 · 缺省全部落位
        format: UNFILLED      # §8.2 可选 · 压缩包格式 · 缺省按扩展名判定
        fatal: UNFILLED       # §8.2 可选 · 缺省 true · 主应用不推断不覆盖（BR-04）

    scripts:                  # §8.3 可选 · 脚本步骤集，按声明序执行（与 patches 混排于同一有序清单）
      - label: UNFILLED       # §8.3 必填 · 日志展示名
        content: UNFILLED     # §8.3 与 url 恰有其一 · 内嵌脚本正文
        url: UNFILLED         # §8.3 与 content 恰有其一 · 远端脚本
        sha256: UNFILLED      # §8.3 可选 · 64 位十六进制 · 缺省不做完整性校验
        position: UNFILLED    # §8.3 可选 · 缺省 host · 本期取值只有 host，声明 container 属声明不合法
        fatal: UNFILLED       # §8.3 可选 · 缺省 true
        timeoutMs: UNFILLED   # §8.3 可选 · 缺省 600000 · 合法区间 [1000, 1800000]，越界即声明不合法
