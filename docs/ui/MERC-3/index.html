<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MERC-3 · 部署扩展步骤与目标版本选择 · UI 原型</title>
<style>
/* ============================================================
   MERC-3 UI 原型 · 部署扩展步骤 / 目标版本选择
   事实来源：PRD v0.5 @ 270f9d0 §6.1 §6.2 §8.4.2 §8.5 §12 §16.2
   视觉 token 与组件形态取自仓内真实实现：
     frontend/src/views/instance/deploy.vue（含 "Deployment Bay overrides" 生效块）
     frontend/src/components/DeployProgress.vue
     frontend/src/styles/variables.scss
   本文件是设计产物，不是功能代码；不接入后端、不发请求。
   ============================================================ */

:root{
  /* 平台深色主题实际生效值（frontend/src/styles/variables.scss:212-227） */
  --platform-surface-0:#0b1722;
  --platform-surface-1:#10202d;
  --platform-surface-2:#142735;
  --platform-surface-3:#1a3040;
  --platform-line:#263847;
  --platform-cyan:#27b5f3;
  --platform-amber:#f2b84b;
  --platform-red:#f0646a;
  --platform-green:#52cf82;
  --platform-text-primary:#e7eef5;
  --platform-text-regular:#c1ceda;
  --platform-text-secondary:#8d9cac;
  --platform-text-muted:#68788a;
  /* deploy.vue 使用但仓内未定义的两个 token（已知缺陷）；原型内按意图取 cyan */
  --platform-accent:#27b5f3;
  --platform-accent-soft:rgba(39,181,243,.14);
  --border-radius-base:5px;
  --platform-card-radius:6px;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--platform-surface-0);color:var(--platform-text-primary);font:14px/1.6 var(--font-sans)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
svg{display:block}

/* ---------- 原型外框（非产品 UI） ---------- */
.proto-bar{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:12px;
  padding:12px 20px;background:var(--platform-surface-2);border-bottom:1px solid var(--platform-line)}
.proto-bar h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.proto-bar .k{font:9px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--platform-text-muted)}
.proto-legend{margin-left:auto;font-size:11px;color:var(--platform-text-secondary);max-width:520px}
.proto-legend b{color:var(--platform-amber);font-weight:600}
.proto-body{display:grid;grid-template-columns:248px minmax(0,1fr);gap:0;align-items:start}
.proto-nav{position:sticky;top:53px;max-height:calc(100vh - 53px);overflow:auto;padding:16px 12px 32px;
  border-right:1px solid var(--platform-line);background:var(--platform-surface-1)}
.proto-nav h2{margin:14px 0 6px;font:9px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--platform-text-muted)}
.proto-nav h2:first-child{margin-top:0}
.nav-item{display:block;width:100%;text-align:left;padding:7px 9px;margin-bottom:2px;border-radius:4px;
  font-size:12px;color:var(--platform-text-secondary);border:1px solid transparent}
.nav-item:hover{background:var(--platform-surface-2);color:var(--platform-text-primary)}
.nav-item.on{background:var(--platform-accent-soft);border-color:rgba(39,181,243,.5);color:var(--platform-text-primary);font-weight:600}
.proto-stage{padding:20px 24px 64px;min-width:0}

/* ---------- 状态说明卡（非产品 UI） ---------- */
.state-card{margin-bottom:16px;padding:14px 16px;border:1px solid var(--platform-line);border-left:3px solid var(--platform-cyan);
  border-radius:var(--border-radius-base);background:var(--platform-surface-1)}
.state-card h3{margin:0 0 6px;font-size:14px;font-weight:650}
.state-card dl{display:grid;grid-template-columns:88px minmax(0,1fr);gap:4px 12px;margin:0;font-size:12px}
.state-card dt{color:var(--platform-text-muted);font:9px/1.9 var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.state-card dd{margin:0;color:var(--platform-text-secondary)}
.chip{display:inline-block;padding:1px 7px;margin:0 4px 3px 0;border:1px solid var(--platform-line);border-radius:10px;
  font:10px/1.7 var(--font-mono);color:var(--platform-text-secondary);background:var(--platform-surface-2)}
.chip.ac{border-color:rgba(82,207,130,.45);color:var(--platform-green)}

/* ---------- 产品外壳：el-card / 页头 ---------- */
.deploy-container{padding:4px 2px 28px}
.deploy-shell{border:1px solid var(--platform-line);border-radius:var(--platform-card-radius);
  background:var(--platform-surface-1);box-shadow:0 16px 32px rgba(0,0,0,.14);overflow:hidden}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
  padding:20px 24px;border-bottom:1px solid var(--platform-line);
  background:linear-gradient(115deg,rgba(67,184,232,.14),transparent 45%),var(--platform-surface-2)}
.header-copy .title{font-size:22px;font-weight:700;letter-spacing:-.025em}
.header-copy p{margin:0;color:var(--platform-text-muted);font-size:11px}
.header-context{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.header-status{display:flex;align-items:center;gap:6px;font:10px/1 var(--font-mono);color:var(--platform-text-secondary)}
.header-status i{width:7px;height:7px;border-radius:50%;background:var(--platform-accent);box-shadow:0 0 0 4px var(--platform-accent-soft)}

/* ---------- 工作台区（grid 232px | 1fr） ---------- */
.deploy-workbench{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:620px}
.deploy-rail{display:flex;flex-direction:column;padding:22px 18px 18px;border-right:1px solid var(--platform-line);background:var(--platform-surface-0)}
.rail-caption{font:9px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--platform-text-muted)}
.rail-context{display:grid;gap:4px;margin-top:18px;padding:12px;border:1px solid var(--platform-line);border-radius:4px;background:var(--platform-surface-2)}
.rail-context span{font-size:10px;color:var(--platform-text-muted)}
.rail-context strong{font-size:12px;font-weight:600;color:var(--platform-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-divider{height:1px;margin:8px 0 5px;background:var(--platform-line)}
.rail-note{margin-top:auto;padding-top:16px;border-top:1px solid var(--platform-line);font-size:10px;line-height:1.55;color:var(--platform-text-muted)}
.steps{margin-top:24px;list-style:none;padding:0}
.steps li{display:flex;gap:10px;min-height:57px;position:relative}
.steps .dot{flex:0 0 auto;width:22px;height:22px;border:1px solid var(--platform-line);border-radius:50%;
  background:var(--platform-surface-0);display:grid;place-items:center;color:var(--platform-text-muted);z-index:1}
.steps li:not(:last-child)::after{content:"";position:absolute;left:11px;top:23px;bottom:-1px;width:1px;background:var(--platform-line)}
.steps .lbl{padding-top:2px;font-size:12px;line-height:18px;color:var(--platform-text-muted)}
.steps li.done .dot{border-color:var(--platform-green);color:var(--platform-green)}
.steps li.done .lbl{color:var(--platform-text-primary);font-weight:650}
.steps li.cur .dot{border-color:var(--platform-accent);color:var(--platform-accent);box-shadow:0 0 0 3px var(--platform-accent-soft)}
.steps li.cur .lbl{color:var(--platform-text-primary);font-weight:650}

.deploy-main{min-width:0;background:var(--platform-surface-1);display:flex;flex-direction:column}
.stage-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:22px 24px 18px;
  border-bottom:1px solid var(--platform-line);background:linear-gradient(90deg,rgba(67,184,232,.06),transparent 58%)}
.stage-header h2{margin:6px 0 4px;font-size:20px;font-weight:650;letter-spacing:-.02em}
.stage-header p{margin:0;max-width:560px;font-size:11px;line-height:1.6;color:var(--platform-text-secondary)}
.stage-index{font:600 28px/1 var(--font-mono);color:var(--platform-accent);opacity:.7}
.step-content{flex:1;padding:22px 24px 24px}
.step-actions{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px 20px;border-top:1px solid var(--platform-line);background:var(--platform-surface-2)}

/* ---------- Element Plus 形制（原型内复刻） ---------- */
.ep-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border:1px solid var(--platform-line);
  border-radius:var(--border-radius-base);background:var(--platform-surface-2);font-size:14px;color:var(--platform-text-regular)}
.ep-btn:hover{border-color:var(--platform-cyan);color:var(--platform-cyan)}
.ep-btn--primary{background:#27b5f3;border-color:#27b5f3;color:#04131d;font-weight:600}
.ep-btn--primary:hover{background:#49c4f7;border-color:#49c4f7;color:#04131d}
.ep-btn--sm{padding:5px 11px;font-size:12px}
.ep-btn[disabled]{opacity:.5;pointer-events:none}
.ep-input{display:flex;align-items:center;gap:8px;width:100%;padding:6px 11px;border:1px solid var(--platform-line);
  border-radius:var(--border-radius-base);background:var(--platform-surface-0);color:var(--platform-text-regular);font-size:13px}
.ep-tag{display:inline-flex;align-items:center;gap:4px;padding:0 8px;border:1px solid var(--platform-line);border-radius:4px;
  background:var(--platform-surface-2);font-size:12px;line-height:22px;color:var(--platform-text-secondary);white-space:nowrap}
.ep-tag--primary{border-color:rgba(39,181,243,.5);color:var(--platform-cyan);background:var(--platform-accent-soft)}
.ep-tag--success{border-color:rgba(82,207,130,.5);color:var(--platform-green);background:rgba(82,207,130,.1)}
.ep-tag--warning{border-color:rgba(242,184,75,.5);color:var(--platform-amber);background:rgba(242,184,75,.1)}
.ep-tag--danger{border-color:rgba(240,100,106,.5);color:var(--platform-red);background:rgba(240,100,106,.1)}
.ep-tag--lg{line-height:26px;padding:0 10px}
.ep-radio{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border:1px solid var(--platform-line);
  background:var(--platform-surface-0);font-size:13px;color:var(--platform-text-secondary)}
.ep-radio+.ep-radio{border-left-width:0}
.ep-radio:first-child{border-radius:var(--border-radius-base) 0 0 var(--border-radius-base)}
.ep-radio:last-child{border-radius:0 var(--border-radius-base) var(--border-radius-base) 0}
.ep-radio.on{background:var(--platform-accent-soft);color:var(--platform-cyan);font-weight:600;
  box-shadow:inset 0 0 0 1px rgba(39,181,243,.55)}
.ep-select{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;width:300px;max-width:100%;
  padding:6px 11px;border:1px solid var(--platform-line);border-radius:var(--border-radius-base);
  background:var(--platform-surface-0);font-size:14px;color:var(--platform-text-primary)}
.ep-select.is-focus{border-color:var(--platform-cyan)}
.ep-select.is-disabled{color:var(--platform-text-muted);background:var(--platform-surface-2)}
.ep-select .caret{color:var(--platform-text-muted);transition:transform .2s}
.ep-select.open .caret{transform:rotate(180deg)}
.ep-select .placeholder{color:var(--platform-text-muted)}
.ep-dropdown{position:relative;margin-top:4px;width:300px;max-width:100%;padding:4px 0;border:1px solid var(--platform-line);
  border-radius:var(--border-radius-base);background:var(--platform-surface-2);box-shadow:0 12px 24px rgba(0,0,0,.4)}
.ep-option{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;font-size:13px;color:var(--platform-text-regular)}
.ep-option:hover{background:var(--platform-surface-3)}
.ep-option.on{color:var(--platform-cyan);font-weight:650;background:var(--platform-accent-soft)}
/* MF-1：选项 = 主文本（displayName，缺省回退 versionId）+ versionId mono 副标（恒渲染） */
.ep-option .col{display:flex;flex-direction:column;gap:3px;min-width:0}
.ep-option .col .t{font-size:13px;line-height:1.3}
.ep-option .vid{font:10px/1.2 var(--font-mono);color:var(--platform-text-secondary)}
.ep-option small{font:10px/1 var(--font-mono);color:var(--platform-text-secondary);flex:0 0 auto}
.ep-select .vid{font:11px/1 var(--font-mono);color:var(--platform-text-secondary);font-weight:400}
.vid-inline{font:11px/1 var(--font-mono);color:var(--platform-text-secondary);margin-left:8px}
.ep-select .val{display:flex;align-items:baseline;gap:8px;min-width:0}
.ep-alert{display:flex;gap:10px;padding:10px 14px;border-radius:var(--border-radius-base);border:1px solid transparent;font-size:13px}
.ep-alert .t{font-weight:650;font-size:14px}
.ep-alert .d{font-size:12px;line-height:1.6;opacity:.9}
.ep-alert--warning{background:rgba(242,184,75,.08);border-color:rgba(242,184,75,.35);color:var(--platform-amber)}
.ep-alert--error{background:rgba(240,100,106,.08);border-color:rgba(240,100,106,.35);color:var(--platform-red)}
.ep-alert--info{background:rgba(39,181,243,.07);border-color:rgba(39,181,243,.3);color:var(--platform-text-secondary)}
.ep-divider{height:1px;margin:16px 0;background:var(--platform-line)}
.ep-empty{padding:28px 0;text-align:center;font-size:12px;color:var(--platform-text-muted)}
.skeleton{height:12px;margin:10px 0;border-radius:3px;background:linear-gradient(90deg,var(--surface,#142735),var(--platform-surface-3),var(--surface,#142735));
  background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 向导步骤 2 ---------- */
.grid2{display:grid;grid-template-columns:minmax(0,10fr) minmax(0,14fr);gap:24px}
.panel-title{margin-bottom:12px;font-size:13px;font-weight:650;color:var(--platform-text-primary);display:flex;align-items:center;gap:6px}
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.game-list{max-height:540px;padding-right:8px;overflow:auto}
.game-item{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;border:1px solid var(--platform-line);
  border-radius:4px;background:var(--platform-surface-0);cursor:pointer}
.game-item:hover{border-color:var(--platform-accent);background:var(--platform-accent-soft)}
.game-item.on{border-color:var(--platform-accent);background:var(--platform-accent-soft)}
.game-item .av{flex:0 0 auto;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;
  background:var(--platform-surface-3);color:var(--platform-text-secondary)}
.game-item .nm{font-size:13px;font-weight:600;color:var(--platform-text-primary)}
.game-item .cd{font:10px/1.4 var(--font-mono);color:var(--platform-text-muted)}
.game-detail{padding:16px;border:1px solid var(--platform-line);border-radius:4px;background:var(--platform-surface-0)}
.detail-header{display:flex;align-items:center;gap:14px}
.detail-header .av{width:64px;height:64px;display:grid;place-items:center;border-radius:50%;background:var(--platform-surface-3);color:var(--platform-text-secondary)}
.detail-header h3{margin:0 0 2px;font-size:16px;font-weight:650}
.detail-header .gc{font:10px/1.5 var(--font-mono);color:var(--platform-text-muted)}
.detail-header .gd{margin-top:4px;font-size:11px;color:var(--platform-text-secondary)}
.detail-section{margin-bottom:20px}
.detail-section>.section-title{display:flex;align-items:center;gap:6px;margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid var(--platform-line);font-size:13px;font-weight:650;color:var(--platform-text-primary)}
.method-description{margin-top:12px;padding:12px;border-radius:4px;background:var(--platform-surface-2);font-size:11px;color:var(--platform-text-secondary)}
.port-tags{display:flex;flex-wrap:wrap;gap:8px}
.text-secondary{font-size:12px;color:var(--platform-text-secondary)}
.field-description{margin-top:4px;font-size:11px;color:var(--platform-text-secondary)}

/* 本次新增：目标版本区 */
.version-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.version-preview{margin-top:10px;padding:10px 12px;border:1px dashed var(--platform-line);border-radius:4px;background:var(--platform-surface-2)}
.version-preview .h{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:var(--platform-text-secondary)}
.version-preview .h b{color:var(--platform-cyan);font-weight:650}
.step-list{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.step-list li{display:flex;align-items:center;gap:8px;font:11px/1.5 var(--font-mono);color:var(--platform-text-regular)}
.step-list .no{flex:0 0 auto;min-width:32px;color:var(--platform-text-secondary)}
.step-list .kind{flex:0 0 auto;padding:0 6px;border-radius:3px;font-size:10px;border:1px solid var(--platform-line);background:var(--platform-surface-3);color:var(--platform-text-secondary)}
.step-list .pos{margin-left:auto;font-size:10px;color:var(--platform-text-secondary)}
.step-list .pos .fm{color:var(--platform-amber);font-weight:600}

/* ---------- 向导步骤 3 / 4 ---------- */
.config-section{margin-bottom:12px;padding:17px;border:1px solid var(--platform-line);border-radius:4px;background:var(--platform-surface-0)}
.config-section>.section-title{display:flex;align-items:center;gap:6px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--platform-line);font-size:13px;font-weight:650}
.form-row{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;align-items:start;margin-bottom:18px}
.form-row .lab{padding-top:7px;text-align:right;font-size:13px;color:var(--platform-text-secondary)}
.form-row .lab.req::before{content:"* ";color:var(--platform-red)}
.env-check-item{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:12px 14px;
  border:1px solid var(--platform-line);border-left-width:3px;border-radius:4px;background:var(--platform-surface-0)}
.env-check-item.success{border-left-color:var(--platform-green);background:rgba(82,207,130,.07)}
.env-check-item .cl{font-size:13px;font-weight:600}
.env-check-item .cm{margin-left:auto;font:11px/1 var(--font-mono);color:var(--platform-text-secondary)}
.env-result{margin-top:20px;padding:18px;text-align:center;border-radius:var(--border-radius-base);background:var(--platform-surface-2)}
.env-result .t{font-size:16px;font-weight:650;color:var(--platform-green)}
.env-result .s{font-size:12px;color:var(--platform-text-secondary)}

/* ---------- 向导步骤 5：摘要 ---------- */
.confirm-section{margin-bottom:12px;padding:17px;border:1px solid var(--platform-line);border-radius:4px;background:var(--platform-surface-0)}
.confirm-section>.section-title{display:flex;align-items:center;gap:6px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--platform-line);font-size:13px;font-weight:650}
.ep-desc{width:100%;border-collapse:collapse;font-size:13px;background:var(--platform-surface-2)}
.ep-desc th,.ep-desc td{padding:9px 12px;border:1px solid var(--platform-line);text-align:left;vertical-align:top}
.ep-desc th{width:140px;background:var(--platform-surface-3);font-weight:500;color:var(--platform-text-secondary)}
.ep-desc td{color:var(--platform-text-regular)}
tr.hl-row th{color:var(--platform-cyan);background:rgba(39,181,243,.1);font-weight:650}
tr.hl-row td{background:rgba(39,181,243,.05)}
/* 评审标记（非产品元素）：实现侧一律不输出，见 ui-spec.md §8.4 */
.review-flag{margin-left:6px;padding:0 5px;border:1px dashed rgba(242,184,75,.6);border-radius:3px;
  font:9px/16px var(--font-mono);letter-spacing:.02em;background:transparent;color:var(--platform-amber);font-weight:400}
.note-inline{margin-top:6px;font-size:11px;line-height:1.55;color:var(--platform-text-secondary)}
.note-inline.warn{color:var(--platform-amber)}
/* ElMessage 形制（X-02 回落提示，3 秒自动消失，ui-design-spec 2.3.1） */
.ep-message{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;
  padding:9px 14px;border:1px solid rgba(39,181,243,.35);border-radius:var(--border-radius-base);
  background:var(--platform-surface-2);box-shadow:0 10px 24px rgba(0,0,0,.45);font-size:13px;color:var(--platform-text-regular)}
.ep-message .ic{color:var(--platform-cyan)}
.deploy-shell{position:relative}

/* ---------- 部署日志对话框 ---------- */
.dialog-mask{padding:24px;border:1px dashed var(--platform-line);border-radius:var(--platform-card-radius);background:rgba(0,0,0,.25)}
.ep-dialog{width:700px;max-width:100%;border:1px solid var(--platform-line);border-radius:var(--platform-card-radius);
  background:var(--platform-surface-1);box-shadow:0 24px 48px rgba(0,0,0,.5);overflow:hidden}
.ep-dialog__header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--platform-line);
  background:var(--platform-surface-2);font-size:16px;font-weight:650}
.ep-dialog__body{padding:20px}
.ep-dialog__footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--platform-line);background:var(--platform-surface-2)}
.progress-overview{margin-bottom:20px;padding:20px;border:1px solid var(--platform-line);border-radius:var(--border-radius-base);background:var(--platform-surface-2)}
.progress-status{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.progress-status .big{width:48px;height:48px;display:grid;place-items:center}
.status-text{font-size:18px;font-weight:650}
.status-detail{font-size:12px;color:var(--platform-text-secondary)}
.tone-primary{color:var(--platform-cyan)}.tone-warning{color:var(--platform-amber)}
.tone-success{color:var(--platform-green)}.tone-danger{color:var(--platform-red)}.tone-info{color:var(--platform-text-secondary)}
.ep-progress{height:12px;border-radius:6px;background:var(--platform-surface-3);overflow:hidden}
.ep-progress>span{display:block;height:100%;border-radius:6px;background:var(--platform-cyan)}
.ep-progress.is-exception>span{background:var(--platform-red)}
.ep-progress.is-success>span{background:var(--platform-green)}
.progress-pct{text-align:right;font:11px/1 var(--font-mono);color:var(--platform-text-secondary);margin:6px 0 12px}
.progress-steps{position:relative;display:flex;justify-content:space-between;padding:0 10px}
.progress-steps::before{content:"";position:absolute;top:5px;left:20px;right:20px;height:2px;background:var(--platform-line)}
.progress-step{position:relative;text-align:center}
.step-dot{width:12px;height:12px;margin:0 auto;border:2px solid var(--platform-surface-2);border-radius:50%;background:var(--platform-line);transition:all .3s}
.step-label{margin-top:6px;font-size:11px;color:var(--platform-text-muted)}
.progress-step.is-active .step-dot{background:#27b5f3;box-shadow:0 0 0 3px rgba(39,181,243,.18)}
.progress-step.is-active .step-label{color:var(--platform-cyan);font-weight:500}
.progress-step.is-completed .step-dot{background:var(--platform-green)}
.progress-step.is-completed .step-label{color:var(--platform-green)}
.progress-step.ext{outline:1px dashed rgba(242,184,75,.6);outline-offset:4px;border-radius:4px}
.error-alert{margin-bottom:16px}
.logs-section{border:1px solid var(--platform-line);border-radius:var(--border-radius-base);overflow:hidden}
.logs-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--platform-line);background:var(--platform-surface-2);font-size:13px;font-weight:650}
.logs-header .acts{display:flex;gap:14px}
.logs-header .acts button{font-size:12px;color:var(--platform-text-secondary)}
.logs-container{max-height:340px;overflow:auto;padding:12px 16px;background:var(--platform-surface-0);
  font:13px/1.6 var(--font-mono)}
.log-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px;padding:2px 0}
.log-item .ic{flex:0 0 auto;width:14px;margin-top:4px}
.log-time{flex:0 0 auto;min-width:64px;color:var(--platform-text-muted)}
.log-level{flex:0 0 auto;min-width:50px;color:var(--platform-text-secondary)}
.log-message{color:var(--platform-text-regular);word-break:break-word}
.log-info .ic{color:var(--platform-cyan)}
.log-success .ic{color:var(--platform-green)}
.log-warning .ic{color:var(--platform-amber)}
.log-warning .log-message{color:var(--platform-amber)}
.log-error .ic,.log-error .log-message{color:var(--platform-red)}
.log-error{background:rgba(240,100,106,.07);border-radius:3px}
.log-pending .log-message{font-style:italic;color:var(--platform-text-secondary)}
/* 本次新增：阶段分组带（仅扩展阶段运行时渲染） */
.log-stage-band{display:flex;align-items:center;gap:10px;margin:10px 0 6px;font:10px/1 var(--font-mono);
  letter-spacing:.09em;text-transform:uppercase;color:var(--platform-amber)}
.log-stage-band::after{content:"";flex:1;height:1px;background:rgba(242,184,75,.35)}
.log-stage-band.done{color:var(--platform-green)}
.log-stage-band.done::after{background:rgba(82,207,130,.35)}

/* ---------- 右侧标注栏 ---------- */
.annot{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.annot .box{padding:14px 16px;border:1px solid var(--platform-line);border-radius:4px;background:var(--platform-surface-1)}
.annot h4{margin:0 0 8px;font:9px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--platform-text-muted)}
.annot ul,.annot ol{margin:0;padding-left:18px;font-size:12px;line-height:1.75;color:var(--platform-text-secondary)}
.annot code{padding:1px 5px;border-radius:3px;background:var(--platform-surface-3);font:11px/1.6 var(--font-mono);color:var(--platform-text-regular)}
.sw{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px;vertical-align:-1px}

@media (max-width:1180px){
  .proto-body{grid-template-columns:1fr}
  .proto-nav{position:static;display:flex;flex-wrap:wrap;gap:6px;max-height:none;border-right:0;border-bottom:1px solid var(--platform-line)}
  .proto-nav h2{width:100%}
}
@media (max-width:900px){
  .deploy-workbench{grid-template-columns:190px minmax(0,1fr)}
  .grid2{grid-template-columns:1fr}
}

<body>

<header class="proto-bar">

    左侧切换 <b>25</b> 个状态；仅覆盖本期新增与受影响界面，未列出的界面一律保持现状。
    虚线元素与「<b>评审标记·非产品元素</b>」标签是原型脚手架，实现侧不输出（ui-spec.md §8.4）。

</header>

<div class="proto-body">

</div>

<script>
/* ================= 图标（Element Plus 形制复刻，名称见 ui-spec.md 标注） ================= */
const I = {

  setting:'M512 320a192 192 0 100 384 192 192 0 000-384zm0 64a128 128 0 110 256 128 128 0 010-256z',
  document:'M256 96h384l192 192v544H256zm64 64v576h448V320l-160-160z',
  box:'M512 64l384 192v512L512 960 128 768V256zm0 76L224 296v432l288 144 288-144V296z',

  setup:'M384 128l128 128-96 96-128-128zM576 320l128 128-96 96-128-128zM192 736l352-352 96 96-352 352z',
  tools:'M640 96l288 288-144 144-96-96-352 352-96 96-144-144 352-352-96-96z',
  search:'M448 128a320 320 0 100 640 320 320 0 000-640zm0 64a256 256 0 110 512 256 256 0 010-512zm230 442l192 192-45 45-192-192z',
  tickets:'M192 128h640v768H192zm64 64v640h512V192zm64 96h384v64H320zm0 128h384v64H320zm0 128h256v64H320z',
  delete:'M320 96h384l64 96h192v64H128v-64h192zm-32 160h448l-48 608H336z',
  bottom:'M480 128h64v480h160L512 896 320 608h160z',
  collection:'M256 96h512v832L512 768 256 928z',
  cpu:'M288 288h448v448H288zm64 64v320h320V352zM96 448h128v64H96zm0 160h128v64H96zm704-160h128v64H800zm0 160h128v64H800zM448 96h64V224h-64zm-160 0h64V224h-64zm320 0h64V224h-64z',
  link:'M544 224l96-96a160 160 0 01226 226l-96 96-64-64 96-96a96 96 0 00-132-132l-96 96zm-64 576l-96 96A160 160 0 01158 670l96-96 64 64-96 96a96 96 0 00132 132l96-96zM320 448l384 128-96 96-128-96-160-128z',
  refresh:'M512 128a384 384 0 10384 384h-64a320 320 0 11-320-320v160l224-192L512 64v64z'
};
function svg(n,size){const d=I[n]||I.info;return '<svg class="'+(n==='loading'?'spin':'')+'" width="'+(size||14)+'" height="'+(size||14)+'" viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true"><path d="'+d+'"/></svg>';}

/* ================= 通用片段 ================= */
function steps(active){
  const titles=[['选择主机','monitor'],['选择游戏','grid'],['配置参数','setting'],['环境校验','circle-check'],['确认部署','check']];
  return '<ol class="steps">'+titles.map(function(t,i){
    const cls=i<active?'done':(i===active?'cur':'');
    return '<li class="'+cls+'"><span class="dot">'+svg(i<active?'check':t[1],13)+'</span><span class="lbl">'+t[0]+'</span></li>';
  }).join('')+'</ol>';
}
function shell(o){
  return '<div class="deploy-container"><div class="deploy-shell">'
   + (o.message?'<div class="ep-message"><span class="ic">'+svg('info',14)+'</span>'+o.message+'</div>':'')
   + '<div class="card-header"><div class="header-copy">'
   + '<div class="section-kicker" style="font:9px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--platform-text-muted)">PROVISIONING BAY / INSTANCE DEPLOYMENT</div>'
   + '<div class="title">部署游戏实例</div><p>从节点选择到环境校验，建立一条可回溯的实例部署链路。</p></div>'
   + '<div class="header-context"><span class="ep-tag">'+svg('monitor',12)+' 〈主机名〉</span>'
   + '<span class="ep-tag ep-tag--primary">'+svg('grid',12)+' DNF台服</span>'
   + '<div class="header-status"><i></i>0'+o.step+' / 05 STAGES</div></div></div>'
   + '<div class="deploy-workbench"><aside class="deploy-rail">'
   + '<div class="rail-caption">DEPLOYMENT FLOW</div>'
   + '<div class="rail-context"><span>当前目标</span><strong>dnf-tw-service-01</strong>'
   + '<div class="rail-divider"></div><span>节点</span><strong>〈主机名〉 · 在线</strong></div>'
   + steps(o.step-1)
   + '<div class="rail-note">'+svg('info',11)+' 每个阶段都可以返回调整，部署任务只会在最后确认后创建。</div>'
   + '</aside><section class="deploy-main">'
   + '<div class="stage-header"><div>'
   + '<span style="font:9px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--platform-text-muted)">STAGE 0'+o.step+' / '+o.stepTitle+'</span>'
   + '<h2>'+o.stepTitle+'</h2><p>'+o.stepDesc+'</p></div>'
   + '<span class="stage-index">0'+o.step+'</span></div>'
   + '<div class="step-content">'+o.body+'</div>'
   + '<div class="step-actions">'+ (o.step>1?'<span class="ep-btn">'+svg('arrow-left',13)+'上一步</span>':'')
   + (o.step<5?'<span class="ep-btn ep-btn--primary">下一步 '+svg('arrow-right',13)+'</span>'
             :'<span class="ep-btn ep-btn--primary">'+svg('circle-check',13)+'开始部署</span>')
   + '<span class="ep-btn">取消</span></div>'
   + '</section></div></div></div>';
}
function gameList(){
  const g=[['DNF台服','dnf_tw',true],['求生之路2','l4d2',false],['Minecraft Server','minecraft',false]];
  return '<div class="game-list">'
   +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><div class="ep-input" style="width:auto;flex:1">'+svg('search',13)+'<span style="color:var(--platform-text-muted);font-size:12px">搜索游戏名称或编码</span></div>'
   +'<span class="ep-tag">3 / 12</span></div>'
   + g.map(function(x){return '<div class="game-item'+(x[2]?' on':'')+'"><span class="av">'+svg('box',18)+'</span>'
     +'<div style="min-width:0"><div class="nm">'+x[0]+'</div><div class="cd">'+x[1]+'</div></div>'
     +(x[2]?'<span style="margin-left:auto;color:var(--platform-cyan)">'+svg('check',16)+'</span>':'')
     +'</div>';})
     .join('')+'</div>';
}
/* ---- 本次新增：目标版本区（三种可见性） ---- */
/* MF-1 / 裁定 1：选项主文本 = displayName（缺省回退 versionId）；versionId 恒以 mono 副标呈现。
   目录条目：默认条目（displayName 有意不采用）+ 非默认① （有 displayName）+ 非默认②（无 displayName → 主文本=versionId，与副标同值）。 */
var CAT = [
  {vid:'〈默认条目 versionId〉', dn:null, def:true,  steps:0},
  {vid:'〈versionId ①〉', dn:'〈展示名 ①〉', def:false, steps:3},
  {vid:'〈versionId ②〉', dn:null, def:false, steps:1}
];
function optMain(e){return e.def ? '默认版本' : (e.dn || e.vid);}
function versionBlock(cat,keyPresent,open){
  if(cat==='empty'||cat==='invalid-nodata'){
    // S1：控件不渲染 —— 与改造前逐字节一致（FR-02 / AC-24 ①）
    return '<div class="detail-section" style="opacity:.55;border:1px dashed var(--platform-line);padding:12px 14px;border-radius:4px">'
      +'<div class="section-title" style="margin-bottom:6px;padding-bottom:6px;color:var(--platform-text-muted)">'+svg('info',13)+'目标版本 · 本状态不渲染</div>'
      +'<div class="field-description">此处为本期唯一新增区块。目录读取结果为空（含 dnf-tw 占位模板未填充）时，整个区块连同其标题、提示与占位空间一概不输出，面板与改造前完全一致 —— 右侧虚线框仅为原型标注，不属于产品界面。</div></div>';
  }
  const loading = cat==='loading';
  const single  = cat==='ready-single';
  const entries = single ? CAT.filter(function(e){return e.def;}) : CAT;
  const selEntry = cat==='ready-nondefault' ? entries[1] : entries[0];
  const opts = entries.map(function(e){
    return {e:e, on:(e===selEntry),
      note:(e.def?'不执行部署扩展':'含 '+e.steps+' 个部署扩展步骤')};
  });
  const sel = '<div class="ep-select'+(open?' open is-focus':'')+(loading?' is-disabled':'')+'">'
    + (loading? '<span class="placeholder" style="display:flex;align-items:center;gap:8px">'+svg('loading',13)+'版本目录读取中…</span>'
              : '<span class="val"><span>'+optMain(selEntry)+'</span><span class="vid">'+selEntry.vid+'</span></span>')
    + svg('bottom',12).replace('class="','class="caret ')+'</div>';
  const dd = open? '<div class="ep-dropdown">'+opts.map(function(o){
      return '<div class="ep-option'+(o.on?' on':'')+'"><div class="col"><span class="t">'+optMain(o.e)+'</span>'
        +'<span class="vid">'+o.e.vid+'</span></div>'
        +'<small>'+(o.on?svg('check',13):o.note)+'</small></div>';}).join('')+'</div>' : '';
  const badge = cat==='ready-nondefault'
      ? '<span class="ep-tag ep-tag--primary">'+svg('info',12)+'将执行 '+selEntry.steps+' 个部署扩展步骤</span>'
      : '<span class="ep-tag">'+svg('info',12)+'不执行部署扩展步骤</span>';
  const preview = cat==='ready-nondefault' ? '<div class="version-preview"><div class="h"><span>部署扩展步骤预览 · 按声明顺序执行，只读展示，<b>不探测来源可达性</b>（N-09）</span>'
      +'<button class="ep-btn ep-btn--sm" style="padding:2px 8px">收起</button></div>'
      +'<ul class="step-list">'
      +'<li><span class="no">1/3</span><span class="kind">补丁替换</span>〈步骤标签〉<span class="pos"><span class="fm">失败即终止</span></span></li>'
      +'<li><span class="no">2/3</span><span class="kind">脚本执行</span>〈步骤标签〉<span class="pos">宿主机 · <span class="fm">失败可继续</span></span></li>'
      +'<li><span class="no">3/3</span><span class="kind">补丁替换</span>〈步骤标签〉<span class="pos"><span class="fm">失败即终止</span></span></li>'
      +'</ul></div>' : '';
  const footnote = single
      ? '<div class="field-description">该游戏当前只声明了默认版本，没有可切换的其它版本；控件仍渲染（定稿见 §2-①）。</div>'
      : '<div class="field-description">未选择时按该游戏的默认版本部署，行为与改造前一致。所选版本随实例配置保存，重新部署会重放同一份版本配方。</div>';
  return '<div class="detail-section" data-block="target-version">'
    +'<div class="section-title">'+svg('collection',13)+'目标版本<span class="review-flag">评审标记·非产品元素</span></div>'
    +'<div class="version-row">'+sel+badge+'</div>'+dd+preview+footnote
    +(keyPresent?'<div class="note-inline warn">'+svg('warning',11)+' 实例配置中已存在版本要求，但本游戏当前无可选版本目录，此处不可改选。</div>':'')
    +'</div>';
}
function wizardStep2(o){
  return '<div class="grid2"><div>'+panelTitle('选择游戏')+gameList()+'</div><div>'+
    '<div class="game-detail">'
    +'<div class="detail-header"><span class="av">'+svg('box',28)+'</span><div style="min-width:0">'
    +'<h3>DNF台服</h3><div class="gc">dnf_tw</div><div class="gd">地下城与勇士台服社区服务端（Docker Compose 部署，自带 MySQL 与网关）</div></div></div>'
    +'<div class="ep-divider"></div>'
    +'<div class="detail-section"><div class="section-title">'+svg('setup',13)+'部署方式</div>'
    +'<div><span class="ep-radio on">'+svg('box',13)+'Docker Compose</span></div>'
    +'<div class="method-description">使用 Docker Compose 部署，适合多容器应用。</div></div>'
    + versionBlock(o.catalog,o.keyPresent,o.open)
    +'<div class="detail-section"><div class="section-title">'+svg('link',13)+'默认端口</div>'
    +'<div class="port-tags"><span class="ep-tag ep-tag--primary ep-tag--lg">game: 〈端口〉</span>'
    +'<span class="ep-tag ep-tag--lg">mysql: 〈端口〉</span><span class="ep-tag ep-tag--lg">gate: 〈端口〉</span>'
    +'<span class="ep-tag ep-tag--lg">relay: 〈端口〉</span><span class="ep-tag ep-tag--lg">stun_start: 〈端口〉</span></div></div>'
    +'<div class="detail-section" style="margin-bottom:0"><div class="section-title">'+svg('cpu',13)+'环境依赖</div>'
    +'<div class="port-tags"><span class="ep-tag">memory: 2G</span><span class="ep-tag">disk: 20G</span><span class="ep-tag">cpu: 1核</span></div></div>'
    +'</div></div></div>';
}
function panelTitle(t){return '<div class="panel-title">'+svg('grid',13)+t+'</div>';}

/* ---- 步骤 4 环境校验：明确不改动（N-09 / §6.1 步骤4） ---- */
function wizardStep4(){
  const rows=[['box','Docker 环境','〈运行时版本〉已安装并运行','success'],['link','端口可用性','所有端口可用（共 N 个）','success'],
    ['tools','磁盘空间','剩余空间 〈值〉，满足要求','success'],['cpu','内存资源','可用内存 〈值〉，满足最低要求','success'],
    ['collection','依赖检查','所有依赖已安装','success']];
  return '<div class="panel-title" style="display:flex;align-items:center;gap:10px">'+svg('circle-check',13)+'环境校验'
    +'<span class="ep-tag ep-tag--warning" style="margin-left:auto">'+svg('info',12)+'本步骤本期不新增任何检查项，也不校验所选版本的可用性</span></div>'
    + rows.map(function(r){return '<div class="env-check-item '+r[3]+'"><span class="ic">'+svg(r[0],16)+'</span>'
      +'<span class="cl">'+r[1]+'</span><span class="cm">'+r[2]+'</span></div>';}).join('')
    +'<div class="env-result"><div class="t">'+svg('circle-check',16)+' 环境校验通过</div><div class="s">可以开始部署</div></div>';
}

/* ---- 步骤 5 确认部署：摘要行（谓词与控件同现） ---- */
function wizardStep5(o){
  const c=o.catalog, k=o.keyPresent;
  const showLine = (c==='ready-default'||c==='ready-nondefault'||c==='ready-single') || k;
  let val='';
  if(c==='ready-nondefault') val='〈展示名 ①〉<span class="vid-inline">〈versionId ①〉</span><span class="ep-tag ep-tag--primary" style="margin-left:8px">将执行 3 个部署扩展步骤</span>';
  else if(k) val='〈versionId ①〉<span class="ep-tag ep-tag--warning" style="margin-left:8px">'+svg('warning',12)+'沿用实例配置</span>'
      +'<div class="note-inline warn">本游戏当前无可选版本目录，此项无法在此改选，也不会被静默替换为默认版本。恢复版本目录后可在「选择游戏」步骤调整。</div>'
      +'<div class="note-inline">目录不可用时 displayName 无从解析，摘要以 <code>versionId</code> 呈现 —— 该值即提交载荷里的 <code>deployVersion</code>，与日志的 BR-12 行同值。</div>';
  else val='默认版本<span class="vid-inline">〈默认条目 versionId〉</span>';
  if(!showLine) val='';
  const rows=[
    ['目标主机','〈主机名〉 (〈IP〉)','monitor'],
    ['游戏','DNF台服','grid'],
    ['部署方式','Docker Compose','box'],
    ['实例名称','dnf-tw-service-01',null],
    ['部署路径','〈部署路径〉',null],
    ['端口号','〈端口〉',null],
    ['自动启动','是',null]
  ];
  let html='';
  function cell(lab,v,ic,hl){
    return '<tr'+(hl?' class="hl-row"':'')+'><th>'+lab+(hl?'<span class="review-flag">评审标记·非产品元素</span>':'')+'</th><td>'
      +(ic?svg(ic,13)+' ':'')+v+'</td></tr>';
  }
  var t=rows.map(function(r){return cell(r[0],r[1],r[2],false);});
  // 两列表格：用 CSS column-count 不适用，改为按 PRD 既有 :column="2" 结构 —— 原型内以单列清晰呈现，标注栏说明实际为 2 列
  html='<div class="confirm-section"><div class="section-title">'+svg('document',13)+'配置摘要'
    +'<span class="text-secondary" style="margin-left:auto;font-size:11px">实现按 el-descriptions :column="2" border 渲染，此处为逐行呈现</span></div>'
    +'<table class="ep-desc"><tbody>';
  html+=t[0]+t[1]+t[2];
  if(showLine) html+=cell('目标版本',val,null,true);
  html+=t[3]+t[4]+t[5]+t[6];
  html+='</tbody></table></div>';
  html+='<div class="confirm-section"><div class="section-title">'+svg('setup',13)+'Compose 变量</div>'
    +'<table class="ep-desc"><tbody>'+cell('MySQL 端口','〈值〉',null,false)+cell('数据库 root 密码','******',null,false)+cell('对外 IP','〈值〉',null,false)+'</tbody></table></div>';
  html+='<div class="ep-alert ep-alert--warning" style="margin-top:24px">'+svg('warning',16)
    +'<div><div class="t">部署确认</div><div class="d">部署过程可能需要几分钟时间，请耐心等待。部署完成后，实例将自动启动。</div></div></div>';
  return html;
}

/* ================= 部署日志对话框 ================= */
function logDialog(o){
  const base=['准备','下载','安装','配置','启动'];
  var labels = o.extInStepper ? ['准备','下载','安装','配置','扩展','启动'] : base;
  var doneIdx = o.doneIdx;
  var pct = o.progress;
  var stepper = labels.map(function(l,i){
    var cls = i<doneIdx?'is-completed':(i===doneIdx?'is-active':'');
    var isExt = o.extInStepper && l==='扩展';
    return '<div class="progress-step '+cls+(isExt?' ext':'')+'"><div class="step-dot"></div><div class="step-label">'+l+'</div></div>';
  }).join('');
  var lines='';
  (o.lines||[]).forEach(function(l){
    if(l.band){ lines+='<div class="log-stage-band">部署扩展</div>'; return; }
    var lvl=(l.lv||'INFO').toLowerCase()==='warn'?'warning':(l.lv||'INFO').toLowerCase();
    var ic={info:'info',success:'circle-check',warning:'warning',error:'circle-close',debug:'info'}[lvl]||'info';
    lines+='<div class="log-item log-'+lvl+'"><span class="ic">'+svg(ic,14)+'</span>'
      +'<span class="log-time">'+l.t+'</span><span class="log-level">['+l.lv+']</span>'
      +'<span class="log-message">'+l.m+'</span></div>';
  });
  if(!o.completed) lines+='<div class="log-item log-pending"><span class="ic spin">'+svg('loading',14)+'</span><span class="log-time">--:--:--</span><span class="log-message">等待更多输出...</span></div>';
  return '<div class="dialog-mask"><div class="ep-dialog">'
   +'<div class="ep-dialog__header">部署进度<span style="color:var(--platform-text-muted)">'+svg('circle-close',16)+'</span></div>'
   +'<div class="ep-dialog__body">'
   +'<div class="progress-overview"><div class="progress-status">'
   +'<span class="big tone-'+o.tone+'">'+svg(o.bigIcon,48)+'</span>'
   +'<div class="status-info"><div class="status-text tone-'+o.tone+'">'+o.statusText+'</div>'
   +'<div class="status-detail">'+(o.completed ? (o.success
        ? '<span class="tone-success">'+svg('circle-check',13)+' 部署成功</span>'
        : '<span class="tone-danger">'+svg('circle-close',13)+' 部署失败</span>')
      : '<span class="tone-info">'+svg('timer',13)+' 已用时 '+o.elapsed+'</span>')+'</div></div></div>'
   +'<div class="ep-progress'+(o.completed?(o.success?' is-success':' is-exception'):'')+'"><span style="width:'+pct+'%"></span></div>'
   +'<div class="progress-pct">'+pct+'%　<span style="color:var(--platform-text-muted)">数值仅为示意，阶段区间由技术设计按 BR-10 划分</span></div>'
   +'<div class="progress-steps">'+stepper+'</div></div>'
   +(o.error?'<div class="ep-alert ep-alert--error error-alert">'+svg('circle-close',16)+'<div><div class="t">部署失败</div><div class="d">'+o.error+'</div></div></div>':'')
   +'<div class="logs-section"><div class="logs-header"><span>'+svg('tickets',13)+' 部署日志</span>'
   +'<span class="acts"><button>'+svg('delete',12)+' 清空</button><button>'+svg('bottom',12)+' 到底部</button></span></div>'
   +'<div class="logs-container">'+(o.lines&&o.lines.length?lines:'<div class="ep-empty">暂无日志</div>')+'</div></div>'
   +'</div>'
   +'<div class="ep-dialog__footer">'+(o.completed?(o.success?'<span class="ep-btn">完成</span>'
        :'<span class="ep-btn ep-btn--primary">'+svg('refresh',13)+'重试</span><span class="ep-btn">关闭</span>')
       :'<span style="font-size:11px;color:var(--platform-text-muted)">进行中：本窗口为只读日志观察窗，无控制按钮（现状）</span>')+'</div>'
   +'</div></div>';
}

/* ================= 渲染 ================= */
var cur = 'w1';
function nav(){
  var g='',html='';
  SC.forEach(function(s){
    if(s.g!==g){g=s.g;html+='<h2>'+g+'</h2>';}
    html+='<button class="nav-item'+(s.id===cur?' on':'')+'" data-id="'+s.id+'">'+s.name+'</button>';
  });
  document.getElementById('nav').innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll('.nav-item'),function(b){
    b.onclick=function(){cur=b.getAttribute('data-id');render();window.scrollTo(0,0);};
  });
}
function stateCard(s){
  var ac=(s.ac||[]).map(function(a){return '<span class="chip ac">'+a+'</span>';}).join('');
  return '<h3>'+s.name+'</h3><dl>'
    +'<dt>状态</dt><dd>'+s.state+'</dd>'
    +'<dt>触发条件</dt><dd>'+s.trigger+'</dd>'
    +'<dt>本屏差异</dt><dd>'+s.diff+'</dd>'
    +'<dt>对应需求</dt><dd>'+ac+'</dd></dl>';
}
function annot(s){
  var items=s.annot.map(function(a,i){return '<li><b style="color:var(--platform-text-primary)">'+a[0]+'：</b>'+a[1]+'</li>';}).join('');
  var token='<li>容器：<code>border 1px var(--platform-line)</code> · <code>radius 4px</code> · <code>padding 12px / 16px / 17px</code>（沿用 deploy.vue 生效值）</li>'
    +'<li>标题：<code>13px / 650</code> + <code>padding-bottom 8px</code> + <code>border-bottom var(--platform-line)</code></li>'
    +'<li>辅助文字：<code>11px</code> <code>var(--platform-text-secondary)</code>；mono 标注 <code>9-10px / letter-spacing .09em</code></li>'
    +'<li>色值：<b>本期新增使用</b>（token 本身早已定义于 <code>variables.scss</code>，本期不新增任何色值） <span class="sw" style="background:var(--platform-amber)"></span><code>--platform-amber #f2b84b</code> 用于「部署扩展」阶段带与既存键提示；<span class="sw" style="background:var(--platform-cyan)"></span><code>--platform-cyan #27b5f3</code> 用于选中态；<span class="sw" style="background:var(--platform-green)"></span><code>#52cf82</code> 成功；<span class="sw" style="background:var(--platform-red)"></span><code>#f0646a</code> 失败</li>'
    +'<li><b>不实现清单</b>：<code>.review-flag</code>（虚线「评审标记·非产品元素」）、W1 的虚线占位框、本右侧标注栏与左侧导航、以及本文件 <code>:root</code> 自补的 <code>--platform-accent</code> / <code>--platform-accent-soft</code> 都只是<b>原型脚手架</b>；实现侧一律不输出（见 ui-spec.md §8.4）。</li>'
    +'<li>间距全部为 8px 网格倍数（4 / 8 / 12 / 16 / 20 / 24），禁零散值 —— ui-design-spec 2.2.4</li>'
    +'<li>无障碍：控件带 <code>aria-labelledby</code> 指向区块标题；阶段带不仅靠颜色，同时提供文字「部署扩展」；状态三重标识 = 颜色 + 图标 + 文字</li>';
  return '<div class="box"><h4>交互与文案规则</h4><ul>'+items+'</ul></div>'
       +'<div class="box"><h4>设计标注（token / 尺寸 / 无障碍）</h4><ul>'+token+'</ul></div>';
}
function screen(s){
  if(s.screen==='wizard'){
    return shell({step:s.step,stepTitle:s.stepTitle,stepDesc:s.stepDesc,message:s.message,
      body:s.step===2?wizardStep2(s):(s.step===4?wizardStep4():wizardStep5(s))});
  }
  return logDialog(s);
}
function render(){
  var s=SC.filter(function(x){return x.id===cur;})[0];
  document.getElementById('state').innerHTML=stateCard(s);
  document.getElementById('screen').innerHTML=screen(s);
  document.getElementById('annot').innerHTML=annot(s);
  nav();
}
render();
</script>
